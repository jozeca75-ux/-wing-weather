<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wing Weather · Lagoa de Ibiraquera</title>
  <meta name="description" content="Condições de vento para wing na Lagoa de Ibiraquera, Santa Catarina.">
  <link rel="preload" href="fonts/jersey-15-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Ao atualizar style.css ou app.js, aumente o número de versão (?v=) para o navegador não usar o arquivo antigo -->
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="ceu-ensolarado carregando">
  <!-- Tela de abertura (Figma: loading) -->
  <div id="abertura" class="abertura" role="status" aria-label="Carregando condições">
    <div class="abertura-conteudo">
      <div class="abertura-icones" aria-hidden="true">
        <img src="assets/sunny.svg" width="60" height="60" alt="">
        <img src="assets/cloudy-sunny.svg" width="60" height="60" alt="">
        <img src="assets/cloud.svg" width="60" height="60" alt="">
        <img src="assets/rainy.svg" width="60" height="60" alt="">
      </div>
      <p class="abertura-titulo">WING</p>
      <p class="abertura-titulo">WEATHER</p>
    </div>
  </div>

  <main class="interface" aria-live="polite">
    <ul class="info">
      <li class="info-item">
        <img id="icone-ceu" src="assets/sunny.svg" width="24" height="24" alt="">
        <span id="texto-ceu">CARREGANDO...</span>
      </li>
      <li class="info-item">
        <img src="assets/wind.svg" width="24" height="24" alt="">
        <span id="texto-velocidade">VELOCIDADE= --km/h</span>
      </li>
      <li class="info-item">
        <img id="icone-condicao" src="assets/bom.svg" width="24" height="24" alt="">
        <span id="texto-condicao">--</span>
      </li>
      <li class="info-item">
        <img src="assets/pin.svg" width="24" height="24" alt="">
        <span>LAGOA DE IBIRAQUERA</span>
      </li>
    </ul>

    <p id="sigla" class="sigla" aria-label="Direção do vento">N</p>

    <img id="seta" class="seta" src="assets/seta.svg" width="84" height="636" alt="">
  </main>

  <script src="app.js?v=5"></script>
</body>
</html>
